[package]
name = "glide-desktop"
version = "0.6.1"
description = "Local-first personal network deployment manager"
authors = ["Glide Contributors"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "glide_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "0.3"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
url = "2"
zeroize = "1"

[profile.release]
strip = "none"
