name: Build desktop apps

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: desktop-${{ github.ref }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: glide-macos-unsigned
            bundle: app
            bundlePath: src-tauri/target/release/bundle/macos
            platform: macOS
            runner: macos-14
          - artifact: glide-windows-unsigned
            bundle: nsis
            bundlePath: src-tauri/target/release/bundle/nsis
            platform: Windows
            runner: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test frontend
        run: npm run test:coverage

      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Build desktop bundle
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}

      - name: Upload unsigned test bundle
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundlePath }}
          retention-days: 7
